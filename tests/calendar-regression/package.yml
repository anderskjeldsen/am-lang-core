id: calendar-regression
version: 0.1.0
type: application
dependencies:
  - id: am-lang-core
    type: local
    path: ../..
platforms:
  - id: libc
    abstract: true
  - id: macos-arm
    extends: libc
    gccCommand: gcc -O1 -g -fsanitize=address,undefined
    additionalLinkerFlags: ["-fsanitize=address,undefined"]
  - id: amigaos
    extends: libc
    gccCommand: m68k-amigaos-gcc -O3
    linkerCommand: m68k-amigaos-gcc
    gccAdditionalOptions: ["-noixemul"]
    additionalLinkerFlags: ["-noixemul"]
  - id: calendar-utc
    extends: macos-arm
    gccCommand: gcc -O1 -g -fsanitize=address,undefined
    gccAdditionalOptions: ["-DAM_CALENDAR_UTC_ONLY"]
buildTargets:
  - id: macos-arm
    platform: macos-arm
  - id: calendar-utc
    platform: calendar-utc
  - id: amigaos_docker
    platform: amigaos
    dockerBuild:
      image: amiga-gcc:latest
      buildPath: /host
