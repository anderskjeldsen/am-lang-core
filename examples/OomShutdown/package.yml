# Out of memory shuts the program down in an orderly way (Redmine #446).
# A real program, run by run.sh: each mode runs out of memory somewhere
# (Arc.failAllocationsAfter) and run.sh checks the exit code, the message
# and which #runOnExit hooks ran. `./run.sh` for linux-x64 (plus an
# AddressSanitizer build), `./run.sh --amiga` for AmigaOS under the
# amlang-amiberry image.
id: oom-shutdown
version: 1.0.0
type: application
dependencies:
  - id: am-lang-core
    type: local
    path: ../..
platforms:
  - id: libc
    abstract: true
  - id: linux-x64
    extends: libc
    gccCommand: gcc -O1
    gccAdditionalOptions:
      - -pthread
  # The same with AddressSanitizer and TRACKOBJECTS (run.sh, #447): no
  # use-after-free from the end-of-heap release, no leak, and every object
  # released ("Allocated objects 2": the immortal out-of-memory exception and
  # its message).
  - id: linux-x64-asan
    extends: linux-x64
    gccCommand: gcc -O1 -g -fno-omit-frame-pointer -fsanitize=address -DTRACKOBJECTS
    gccAdditionalOptions:
      - -pthread
    additionalLinkerFlags:
      - -fsanitize=address
  - id: amigaos
    extends: libc
    gccCommand: m68k-amigaos-gcc -O2
    gccAdditionalOptions:
      - -noixemul
    additionalLinkerFlags:
      - -noixemul
buildTargets:
  - id: linux-x64
    platform: linux-x64
  - id: linux-x64-asan
    platform: linux-x64-asan
  - id: amigaos-docker
    platform: amigaos
    dockerBuild:
      image: amiga-gcc:latest
      buildPath: /host
