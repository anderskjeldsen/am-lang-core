# Out of memory shuts the program down in an orderly way (Redmine #446).
# A real program, run by run.sh: each mode runs out of memory somewhere
# (Arc.failAllocationsAfter) and run.sh checks the exit code, the message
# and which #runOnExit hooks ran. `./run.sh` for linux-x64, `./run.sh --amiga`
# for AmigaOS under the amlang-amiberry image.
id: oom-shutdown
version: 1.0.0
type: application
dependencies:
  - id: am-lang-core
    type: local
    path: ../..
platforms:
  - id: libc
    abstract: true
  - id: linux-x64
    extends: libc
    gccCommand: gcc -O1
    gccAdditionalOptions:
      - -pthread
  - id: amigaos
    extends: libc
    gccCommand: m68k-amigaos-gcc -O2
    gccAdditionalOptions:
      - -noixemul
    additionalLinkerFlags:
      - -noixemul
buildTargets:
  - id: linux-x64
    platform: linux-x64
  - id: amigaos-docker
    platform: amigaos
    dockerBuild:
      image: amiga-gcc:latest
      buildPath: /host
