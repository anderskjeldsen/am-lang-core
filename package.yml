buildTargets:
  # Plain in-environment build: runs `make -f amigaos.makefile` directly,
  # so m68k-amigaos-gcc must be on PATH — i.e. ON-Amiga (ADE) or INSIDE the
  # amiga-gcc / amiga-gcc-amlang docker images (`amlc build . -bt amigaos`
  # in the container; no docker-in-docker). Host-side builds without the
  # toolchain should use amigaos-docker below instead.
  - id: amigaos
    platform: amigaos
    features: ["floatingPoint"]
  # No floatingPoint: Double, Float and Math are left out of the build and the
  # value union loses its double/float members, so the generated C needs no
  # soft-float helpers at all. For a stock 68000 with no coprocessor.
  - id: amigaos-nofloat
    platform: amigaos
    features: []
  - id: amigaos-docker
    platform: amigaos
    features: ["floatingPoint"]
    dockerBuild:
      image: amiga-gcc:latest
      buildPath: /host
  - id: macos
    platform: macos
    features: ["floatingPoint"]
    commands:
      - make -f macos.makefile
  - id: macos-arm
    platform: macos-arm
    features: ["floatingPoint"]
    commands:
      - make -f macos-arm.makefile
  - id: linux-x64
    platform: linux-x64
    features: ["floatingPoint"]
  - id: windows_docker
    commands: 
      - docker run --rm -v ${build_dir}:/usr/src/ -w /usr/src/ gcc:12.1 make -f linux-x64.makefile
  - id: morphos-ppc_docker
    platform: morphos-ppc
    commands:
      - docker run --rm -v ${build_dir}:/work -e USER=$( id -u ) -e GROUP=$( id -g ) -it amigadev/crosstools:ppc-morphos make -f morphos_ppc.makefile -C /work all
  - id: morphos-ppc_docker_mac
    platform: morphos-ppc
    commands:
      - docker run --rm -v ${build_dir}:/work -i amigadev/crosstools:ppc-morphos make -f morphos-ppc.makefile -C /work all
  - id: morphos-ppc_docker_win
    platform: morphos-ppc
    commands:
      - docker run --rm -v ${build_dir}:/work -e -i amigadev/crosstools:ppc-morphos make -f morphos-ppc.makefile -C /work all
  - id: aros-x86-64_docker_win
    platform: aros-x86-64
    commands: 
      - docker run --rm -v ${build_dir}:/work -i amigadev/crosstools:x86_64-aros make aros-x86-64.makefile all
  # In-environment build: needs aarch64-aros-gcc on PATH, i.e. run from inside
  # the aros-arm64-dev:sdk container (no docker-in-docker).
  - id: aros-arm64
    platform: aros-arm64
    features: ["floatingPoint"]
  # Host-side build/test for AROS on a Raspberry Pi (aarch64).
  # The image is amd64-only, hence the explicit platform - Docker would
  # otherwise refuse it on an arm64 host, or run it emulated with a warning
  # on every invocation. Pull once:
  #   docker pull --platform linux/amd64 midwan/aros-compiler:aarch64-aros
  - id: aros-arm64-docker
    platform: aros-arm64
    features: ["floatingPoint"]
    dockerBuild:
      image: midwan/aros-compiler:aarch64-aros
      buildPath: /host
      platform: linux/amd64
  - id: aros-m68k
    platform: aros-m68k
    features: ["floatingPoint"]
  # Host-side build in the amiga-gcc image, same contract as amigaos-docker.
  - id: aros-m68k-docker
    platform: aros-m68k
    features: ["floatingPoint"]
    dockerBuild:
      image: amiga-gcc:latest
      buildPath: /host
    # Boots AROS m68k under Amiberry and runs the test binary there. Build the
    # image first with ../amiberry-aros-m68k/build.sh. The rig needs no
    # Kickstart ROM - Amiberry's own AROS ROM is the kickstart, and the AROS
    # nightly boot floppy supplies SYS:/C:.
    dockerTest:
      image: amlang-aros-m68k:latest
      timeoutSeconds: 3000
  - id: aros-x86-64-docker
    platform: aros-x86-64
    features: ["floatingPoint"]
    dockerBuild:
      image: aros-x64-dev:sdk
      buildPath: /host

  - id: linux-x64_docker
    platform: linux-x64
    features: ["floatingPoint"]
    dockerBuild:
      image: gcc:14.2.0
      buildPath: /usr/src/myapp
  - id: linux-arm64v8_docker
    platform: linux-arm64v8
    features: ["floatingPoint"]
    dockerBuild:
      image: arm64v8/gcc:14.2.0
      buildPath: /usr/src/myapp
    dockerRun:
      image: arm64v8/ubuntu:24.04
      buildPath: /usr/src/myapp


