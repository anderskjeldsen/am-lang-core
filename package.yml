
id: am-lang-core
version: 0.11.0
type: library
features:
  - name: floatingPoint
    global: true
    additionalLibraries:
      - m
dependencies:
  - id: am-tests
    testOnly: true
    realm: github
    type: git-repo
    tag: latest
    url: https://github.com/anderskjeldsen/am-tests.git
    features: ["floatingPoint"]
platforms:
  - id: libc
    abstract: true
    additionalHeaders:
      - core.h
      - core_inline_functions.h
    additionalCSources:
      - inputFilename: core.c
        outputFilename: core.o
  - id: amigaos
    extends: libc
    gccCommand: m68k-amigaos-gcc -O3
    additionalHeaders:
      - amiga.h
    additionalCSources:
      - inputFilename: amiga.c
        outputFilename: amiga.o
      - inputFilename: errno.c
        outputFilename: errno.o
    gccAdditionalOptions:
      - -noixemul
      - -UHAVE_TIMEGM
    gccAdditionalLibraries:
    additionalLinkerFlags:
      - -noixemul

  - id: linux-x64
    extends: libc
    gccCommand: gcc -O3
    gccAdditionalOptions:
      - -pthread        # libc/Am/Threading/Thread.c uses pthread; macOS
                        # ships pthread in libSystem so the flag is a
                        # no-op there but it's required on Linux glibc.
  - id: linux-arm64v8
    extends: linux-x64
    gccCommand: gcc -O3
    gccAdditionalOptions:
      - -pthread
  - id: linux-ppc32
    extends: libc
    gccCommand: powerpc-linux-gnu-gcc -O1
    gccAdditionalOptions:
      - -pthread
  - id: linux-ppc64
    extends: linux-ppc32
    gccCommand: powerpc-linux-gnu-gcc -O2
  - id: macos
    extends: libc
    gccCommand: gcc -O3
    gccAdditionalOptions:
      - -pthread
    # additionalIncludePaths:
    #   - c-libs/openssl/include
    # gccLibraryPaths:
    #   - c-libs/openssl/lib
    # gccAdditionalOptions:
    #   - -DOPENSSL_SSL_LIBRARY=c-libs/openssl/lib/libssl.dylib -DOPENSSL_CRYPTO_LIBRARY=c-libs/openssl/lib/libcrypto.3.dylib
    # gccAdditionalLibraries:
    #   - ssl
    #   - crypto

  - id: macos-arm
    extends: libc
    gccCommand: gcc -O3
    gccAdditionalOptions:
      - -pthread
    # additionalIncludePaths:
    #   - c-libs/openssl/include
    # gccLibraryPaths:
    #   - c-libs/openssl/lib
    # gccAdditionalOptions:
    #   - -DOPENSSL_SSL_LIBRARY=c-libs/openssl/lib/libssl.dylib -DOPENSSL_CRYPTO_LIBRARY=c-libs/openssl/lib/libcrypto.3.dylib
    # gccAdditionalLibraries:
    #   - ssl
    #   - crypto
  - id: morphos-ppc
    extends: libc
    gccCommand: ppc-morphos-gcc
    additionalHeaders:
      - morphos.h
    additionalCSources: 
      - inputFilename: morphos.c     
        outputFilename: morphos.o
    gccAdditionalOptions:
      - -noixemul
  # Shared AROS base for every architecture. AROS presents ONE API surface
  # (exec/dos/intuition + posixc) regardless of CPU, so the natives live here
  # in src/native-c/aros/ and the per-arch platforms below add only their
  # toolchain. Arch-specific overrides go in that arch's own folder.
  - id: aros
    abstract: true
    extends: libc
    additionalHeaders:
      - aros.h
    additionalCSources:
      - inputFilename: aros.c
        outputFilename: aros.o
    gccAdditionalOptions:
      # REQUIRED. AROS's ELF loader flatly refuses COMMON symbols:
      #   rom/dos/internalloadseg_elf.c
      #     case SHN_COMMON: SetIoErr(ERROR_BAD_HUNK); return 0;
      # and rom/dos/internalloadseg.c then overwrites that with
      # ERROR_NOT_EXECUTABLE, so the only symptom is "file is not executable".
      # The AROS gcc is 6.5.0, which still defaults to -fcommon (GCC 10 flipped
      # the default), so every uninitialised file-scope global becomes a COMMON
      # symbol and the binary will not load. Diagnosed on a Raspberry Pi:
      # am-lang-core had 283 of them.
      - -fno-common
      # libc/Am/Threading/Thread.c needs pthreads and AROS ships libpthread.a
      # for every arch, so this belongs on the shared base.
      #
      # Deliberately NOT -pthread: the real GNU AROS compilers reject it
      # ("aarch64-aros-gcc: error: unrecognized command line option
      # '-pthread'"). Only the clang-based drivers accept it. -D_REENTRANT is
      # what -pthread would have defined, and works with every driver.
      - -D_REENTRANT
    gccAdditionalLibraries:
      # gccAdditionalOptions only reaches the compile rules — the link needs
      # libpthread named explicitly, since without -pthread no driver adds it.
      #
      # Declared as a LIBRARY rather than an additionalLinkerFlag because
      # placement decides whether it works: linker flags are emitted before the
      # object files, and GNU ld only pulls members from an archive that
      # something ALREADY referenced, so `-lpthread ... objs` silently resolves
      # nothing. On x86-64 that surfaced as every pthread_* symbol undefined at
      # link even though the SDK ships libpthread.a. Libraries are emitted after
      # the objects, which is the order archives need.
      - pthread

  - id: aros-x86-64
    extends: aros
    # The standard AROS cross-compiler name — provided both by
    # amigadev/crosstools:x86_64-aros and by our ../aros-x64-dev:sdk shim
    # image (host x86_64 gcc + the SDK off the pc-x86_64 ISO).
    gccCommand: x86_64-aros-gcc -O2
  # AROS on 64-bit ARM (the raspi-aarch64 target - Raspberry Pi 3/4/5).
  # Inherits aros.h/aros.c from aros-x86-64, the same way linux-arm64v8
  # inherits from linux-x64: the AROS API surface is identical, only the
  # compiler driver differs.
  #
  # There is no GNU aarch64-aros toolchain - AROS builds raspi-aarch64 with
  # LLVM/clang 20.1.0 only. `aarch64-aros-gcc` is a wrapper around that clang
  # (target triple + AROS SDK include/lib paths) provided by the
  # aros-arm64-dev:sdk image; see ../aros-arm64-dev/README.md.
  # AROS on 68k - the amiga-m68k target, i.e. AROS as a Kickstart replacement
  # on real Amiga hardware.
  #
  # Extends amigaos, not aros-x86-64, and that is the interesting part: AROS
  # m68k executables are AmigaOS *hunk* binaries, not ELF. AROS compiles to
  # m68k ELF and then runs elf2hunk, exactly as bebbo's m68k-amigaos-gcc does,
  # because Amiga LoadSeg() only understands hunk. Checked against the nightly
  # ISO - /C/Version and friends are all "AmigaOS loadseg()ble executable".
  #
  # So the toolchain, the object format and the ABI are the AmigaOS ones, and
  # the amigaos natives (amiga.c, errno.c) are the right implementations. What
  # this platform buys is a distinct AM_PLATFORM_ID, a place to hang
  # AROS-specific overrides, and its own build/test target.
  - id: aros-m68k
    extends: amigaos
    gccCommand: m68k-amigaos-gcc -O2
    gccAdditionalOptions:
      # See ../aros-arm64-dev/README.md and the bebbo -fbbb note in MEMORY:
      # the default -fbbb optimiser miscompiles array stores at -O2/-O3.
      - -fbbb=abcefhlmnprsz0
      - -noixemul
    additionalLinkerFlags:
      - -noixemul
  - id: aros-arm64
    extends: aros
    # The real GNU aarch64-aros-gcc 6.5.0, from the published
    # midwan/aros-compiler:aarch64-aros image (recipe:
    # github.com/BlitterStudio/aros-compiler-docker). Its baked sysroot is the
    # raspi-aarch64 SDK - AROS on a Raspberry Pi.
    gccCommand: aarch64-aros-gcc -O2
    gccAdditionalOptions:
      # NOTE: gccAdditionalOptions REPLACES the parent platform's list, it does
      # NOT merge with it. Everything inherited from `aros` must be repeated
      # here or it is silently lost. Dropping -fno-common produces 748 COMMON
      # symbols and AROS refuses the binary with "file is not executable".
      - -fno-common
      - -D_REENTRANT
      # x18 is the AAPCS64 *platform* register: its meaning belongs to the
      # platform ABI, not to us. Reserving it is what makes the binary usable
      # under Macaros (hosted AROS on macOS), which preempts AROS tasks with
      # Darwin signals - macOS supplies zero for x18 in the signal context, so
      # any live value in it is destroyed before AROS's handler can save it.
      # See Macaros RELEASE-NOTES.md, "do not use x18".
      #
      # Safe on real hardware too: -ffixed-x18 only STOPS gcc allocating x18,
      # it changes no calling convention (x18 carries no argument or return
      # value), so it stays link-compatible with the raspi-aarch64 SDK.
      #
      # The SDK is NOT x18-free, so this flag only covers our own code. In
      # midwan/aros-compiler:aarch64-aros (the image this target builds in),
      # 19 archives under .../raspi-aarch64/AROS/Developer/lib use x18 - mostly
      # bundled third-party codecs we never link (libaom 2709, libzstd 1647,
      # libfreetype2 198, liblzma 197), but also libposixc.a (2) and
      # libamiga.a (2).
      #
      # After this flag, all 172 of our objects are x18-free and the linked
      # test_app retains exactly 2 references, both inside libamiga.a's
      # GetDataStreamFromFormat - which has ZERO call sites in the binary. It is
      # linked only because it shares an object file with the startup code, so
      # it never executes and cannot be corrupted. If a future change actually
      # calls into one of those archives, re-check with:
      #   objdump -d --triple=aarch64 test_app | grep -cE '\bx18\b|\bw18\b'
      #
      # Cost is one fewer scratch register.
      - -ffixed-x18
